backend:
  name: github
  repo: daphsander/daphne-sander-website
  branch: main
  # Kein OAuth-Relay nötig: Sveltia CMS erlaubt den Login per persönlichem GitHub-Zugriffstoken,
  # was für eine einzelne Nutzerin die einfachste Methode ist. Siehe README.md.

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "zeitecht_overview"
    label: "ZEITECHT — Übersichtsseite"
    files:
      - file: "de/zeitecht/index.njk"
        label: "ZEITECHT Übersicht"
        name: "zeitecht_overview"
        fields:
          - { label: "Titel (Frontmatter)", name: "pageTitle", widget: "string" }

  - name: "arbeiten_entries"
    label: "Arbeiten — Einträge"
    folder: "de/arbeiten"
    create: true
    slug: "{{slug}}"
    extension: "njk"
    fields:
      - { label: "Titel", name: "pageTitle", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["veröffentlicht", "in entwicklung"] }
      - { label: "Format", name: "format", widget: "select", options: ["Theaterstück", "Drehbuch", "Artikel", "Jugendstück"] }
      - { label: "Hat eigene Detailseite?", name: "has_detail_page", widget: "boolean", default: false }
      - { label: "Derzeit zu sehen?", name: "currently_showing", widget: "boolean", default: false }
      - { label: "Inhalt", name: "body", widget: "markdown" }

  - name: "sparks"
    label: "SPARKS — Prompts"
    files:
      - file: "_data/sparks.json"
        label: "Prompts"
        name: "sparks"
        fields:
          - label: "Prompts"
            name: "prompts"
            widget: "list"
            field: { label: "Prompt", name: "prompt", widget: "string" }

  - name: "legal"
    label: "Rechtliches"
    files:
      - file: "de/impressum.njk"
        label: "Impressum"
        name: "impressum"
        fields:
          - { label: "Inhalt", name: "body", widget: "markdown" }
      - file: "de/datenschutz.njk"
        label: "Datenschutzerklärung"
        name: "datenschutz"
        fields:
          - { label: "Inhalt", name: "body", widget: "markdown" }
